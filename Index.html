
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Reporter - Firebase</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    min-height: 100vh;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 8px 25px #0002;
}

h1 {
    color: #1756a9;
}

.search {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #1769aa;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #0d4778;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.weather {
    background: #eef7ff;
    padding: 22px;
    border-radius: 15px;
}

#icon {
    font-size: 65px;
}

#temperature {
    font-size: 42px;
    color: #e87516;
}

.details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0;
}

.detail {
    background: white;
    padding: 12px 5px;
    border-radius: 10px;
}

.detail p {
    font-weight: bold;
}

#status {
    overflow-wrap: anywhere;
    color: #333;
}

.history-item {
    background: #f1f5fa;
    padding: 12px;
    border-radius: 8px;
    margin: 10px 0;
    text-align: left;
    overflow-wrap: anywhere;
}

.history-item p {
    margin-bottom: 5px;
}

@media (max-width: 450px) {
    .search {
        flex-direction: column;
    }

    .details {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>🌦️ Weather Reporter</h1>
    <p>Real-Time Weather Monitoring System</p>

    <div class="search">
        <input id="cityInput" type="text"
               placeholder="Enter city (e.g. Chennai)">
        <button id="searchBtn">Search</button>
    </div>

    <p id="status">Enter a city to get weather information.</p>

    <div class="weather">
        <h2 id="city">City Name</h2>
        <div id="icon">🌤️</div>
        <h1 id="temperature">-- °C</h1>
        <p id="condition">Weather condition</p>

        <div class="details">
            <div class="detail">
                <h3>💧 Humidity</h3>
                <p id="humidity">-- %</p>
            </div>

            <div class="detail">
                <h3>💨 Wind</h3>
                <p id="wind">-- km/h</p>
            </div>

            <div class="detail">
                <h3>🌡️ Feels Like</h3>
                <p id="feels">-- °C</p>
            </div>
        </div>

        <button id="saveBtn" disabled>
            Save Reading to Firebase
        </button>
    </div>

    <h2>📊 Saved Weather History</h2>
    <div id="history">Loading readings...</div>

</div>

<script type="module">
import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    query,
    limitToLast,
    onValue,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

// FIREBASE CONFIGURATION
const firebaseConfig = {
    apiKey: "AIzaSyDx20YoRDBcGaPgjJ8JYw-J1oTdlHkRqWw",
    authDomain: "weather-reporter-fed13.firebaseapp.com",
    projectId: "weather-reporter-fed13",
    storageBucket: "weather-reporter-fed13.firebasestorage.app",
    messagingSenderId: "798607425952",
    appId: "1:798607425952:web:08531cb2b6674ed3aba4c5",
    measurementId: "G-RTSXXSQQFF"
};

// INITIALIZE FIREBASE
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const $ = id => document.getElementById(id);
let weatherReading = null;

function weatherDescription(code) {
    if (code === 0) return "Clear sky";
    if ([1, 2].includes(code)) return "Mainly clear / Partly cloudy";
    if (code === 3) return "Overcast";
    if ([45, 48].includes(code)) return "Fog";
    if ([51, 53, 55, 56, 57].includes(code)) return "Drizzle";
    if ([61, 63, 65, 66, 67].includes(code)) return "Rain";
    if ([71, 73, 75, 77].includes(code)) return "Snow";
    if ([80, 81, 82].includes(code)) return "Rain showers";
    if ([85, 86].includes(code)) return "Snow showers";
    if ([95, 96, 99].includes(code)) return "Thunderstorm";
    return "Weather information available";
}

function weatherEmoji(code) {
    if (code === 0) return "☀️";
    if ([1, 2].includes(code)) return "🌤️";
    if (code === 3) return "☁️";
    if ([45, 48].includes(code)) return "🌫️";
    if ([51, 53, 55, 56, 57, 61, 63, 65,
         66, 67, 80, 81, 82].includes(code)) return "🌧️";
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "❄️";
    if ([95, 96, 99].includes(code)) return "⛈️";
    return "🌡️";
}

// GET WEATHER DATA
async function getWeather() {
    const cityName = $("cityInput").value.trim();

    if (!cityName) {
        $("status").textContent = "Please enter a city name.";
        return;
    }

    $("searchBtn").disabled = true;
    $("saveBtn").disabled = true;
    weatherReading = null;
    $("status").textContent = "Fetching weather data...";

    try {
        const geoResponse = await fetch(
            "https://geocoding-api.open-meteo.com/v1/search?" +
            new URLSearchParams({
                name: cityName,
                count: "1",
                language: "en",
                format: "json"
            })
        );

        if (!geoResponse.ok) throw new Error("City search failed.");

        const geoData = await geoResponse.json();

        if (!geoData.results?.length) {
            throw new Error("City not found. Try another city.");
        }

        const place = geoData.results[0];

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?" +
            new URLSearchParams({
                latitude: place.latitude,
                longitude: place.longitude,
                current: "temperature_2m,relative_humidity_2m," +
                    "apparent_temperature,weather_code,wind_speed_10m",
                timezone: "auto"
            })
        );

        if (!response.ok) throw new Error("Weather service unavailable.");

        const data = await response.json();
        const current = data.current;
        const description = weatherDescription(current.weather_code);

        weatherReading = {
            city: place.name,
            country: place.country || "",
            temperature: current.temperature_2m,
            humidity: current.relative_humidity_2m,
            wind: current.wind_speed_10m,
            feelsLike: current.apparent_temperature,
            condition: description,
            weatherCode: current.weather_code,
            observedAt: current.time
        };

        $("city").textContent =
            place.name + (place.country ? ", " + place.country : "");

        $("temperature").textContent = current.temperature_2m + " °C";
        $("humidity").textContent = current.relative_humidity_2m + " %";
        $("wind").textContent = current.wind_speed_10m + " km/h";
        $("feels").textContent = current.apparent_temperature + " °C";
        $("condition").textContent = description;
        $("icon").textContent = weatherEmoji(current.weather_code);

        $("status").textContent = "Weather updated successfully.";
        $("saveBtn").disabled = false;

    } catch (error) {
        $("status").textContent = error.message;
    } finally {
        $("searchBtn").disabled = false;
    }
}

$("searchBtn").addEventListener("click", getWeather);

$("cityInput").addEventListener("keydown", event => {
    if (event.key === "Enter") getWeather();
});

// SAVE READING TO FIREBASE
$("saveBtn").addEventListener("click", async () => {
    if (!weatherReading) return;

    $("saveBtn").disabled = true;
    $("status").textContent = "Saving to Firebase...";

    try {
        await push(ref(database, "weather_readings"), {
            ...weatherReading,
            savedAt: serverTimestamp()
        });

        $("status").textContent = "Reading saved successfully!";
    } catch (error) {
        console.error(error);
        $("status").textContent =
            "Save failed. Check database setup and security rules.";
    } finally {
        $("saveBtn").disabled = !weatherReading;
    }
});

// LOAD LATEST 10 READINGS FROM FIREBASE
const latestReadings = query(
    ref(database, "weather_readings"),
    limitToLast(10)
);

onValue(latestReadings, snapshot => {
    const history = $("history");
    history.replaceChildren();

    if (!snapshot.exists()) {
        history.textContent = "No saved readings yet.";
        return;
    }

    const entries = [];

    snapshot.forEach(child => entries.push(child.val()));
    entries.reverse();

    entries.forEach(item => {
        const card = document.createElement("div");
        card.className = "history-item";

        const title = document.createElement("strong");
        title.textContent = `${item.city}, ${item.country || ""}`;

        const details = document.createElement("p");
        details.textContent =
            `Temperature: ${item.temperature} °C | ` +
            `Humidity: ${item.humidity}% | ` +
            `Wind: ${item.wind} km/h`;

        const time = document.createElement("small");
        time.textContent = "Observed at: " + (item.observedAt || "Unknown");

        card.append(title, details, time);
        history.appendChild(card);
    });
}, error => {
    console.error("Firebase read error:", error);
    $("history").textContent =
        "Unable to load history. Check Firebase database rules.";
});
</script>
</body>
</html>
